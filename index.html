<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Ứng Dụng Toàn Cầu - PiLand</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase App & Firestore SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-20">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-globe text-2xl text-yellow-300"></i>
                <span class="text-lg font-bold tracking-wide">Siêu Ứng Dụng Toàn Cầu</span>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openPostModal()" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-semibold px-3 py-1.5 rounded-lg text-sm shadow transition flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Đăng Bài
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Search & Filter bar -->
        <div class="mb-6 flex flex-col md:flex-row gap-3">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
                <input type="text" id="searchInput" oninput="filterPosts()" placeholder="Tìm kiếm bất động sản, xe cộ, dịch vụ..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
            </div>
            <button onclick="toggleMyPosts()" id="myPostsBtn" class="bg-white border border-gray-300 hover:bg-gray-100 px-4 py-2.5 rounded-xl font-medium text-sm shadow-sm transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-tag text-blue-600"></i> Bài đăng của tôi
            </button>
        </div>

        <!-- Categories Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
            <div onclick="filterByCategory('Bất động sản')" class="bg-white p-4 rounded-xl border border-blue-100 shadow-sm hover:shadow-md transition cursor-pointer flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-lg"><i class="fa-solid fa-house"></i></div>
                <div><h4 class="font-bold text-sm">Bất động sản</h4><p class="text-xs text-gray-500">Nhà đất, căn hộ</p></div>
            </div>
            <div onclick="filterByCategory('Xe cộ')" class="bg-white p-4 rounded-xl border border-emerald-100 shadow-sm hover:shadow-md transition cursor-pointer flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-car"></i></div>
                <div><h4 class="font-bold text-sm">Xe cộ</h4><p class="text-xs text-gray-500">Ô tô, xe máy</p></div>
            </div>
            <div onclick="filterByCategory('Đồ điện tử')" class="bg-white p-4 rounded-xl border border-amber-100 shadow-sm hover:shadow-md transition cursor-pointer flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center text-lg"><i class="fa-solid fa-laptop"></i></div>
                <div><h4 class="font-bold text-sm">Đồ điện tử</h4><p class="text-xs text-gray-500">Phone, Laptop</p></div>
            </div>
            <div onclick="filterByCategory('Dịch vụ Web3')" class="bg-white p-4 rounded-xl border border-purple-100 shadow-sm hover:shadow-md transition cursor-pointer flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-lg"><i class="fa-solid fa-coins"></i></div>
                <div><h4 class="font-bold text-sm">Dịch vụ Web3</h4><p class="text-xs text-gray-500">Pi, Crypto, DEX</p></div>
            </div>
        </div>

        <!-- Posts Listing -->
        <h3 id="sectionTitle" class="text-lg font-bold mb-4 text-gray-800">Tất cả bài đăng trực tuyến</h3>
        <div id="postsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Posts Loaded From Firebase -->
        </div>
    </main>

    <!-- Modal Create / Edit Post -->
    <div id="postModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-gray-900" id="modalTitle">Tạo bài đăng mới</h3>
                <button onclick="closePostModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <form onsubmit="savePost(event)" class="space-y-4">
                <input type="hidden" id="editPostId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tiêu đề bài đăng</label>
                    <input type="text" id="postTitle" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Danh mục chính</label>
                        <select id="postMainCat" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="Bất động sản">Bất động sản</option>
                            <option value="Xe cộ">Xe cộ</option>
                            <option value="Đồ điện tử">Đồ điện tử</option>
                            <option value="Dịch vụ Web3">Dịch vụ Web3</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Giá bán</label>
                        <input type="text" id="postPrice" placeholder="VD: 1.5 tỷ / 100 Pi" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Khu vực / Địa điểm</label>
                    <input type="text" id="postLocation" placeholder="VD: Cần Thơ, TP.HCM" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Địa chỉ ví Web3 nhận tiền (Bắt đầu bằng G...)</label>
                    <input type="text" id="postSellerWallet" placeholder="VD: GDK3P89WXYZ9999PI..." required class="w-full border rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Hình ảnh (URL Link ảnh)</label>
                    <input type="text" id="postImage" placeholder="Dán link ảnh https://..." class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả chi tiết</label>
                    <textarea id="postDesc" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Mô tả thông tin sản phẩm..."></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closePostModal()" class="px-4 py-2 border rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium shadow">Lưu bài đăng</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script kết nối Firebase và xử lý ứng dụng -->
    <script>
        // Cấu hình Firebase Cloud thực tế của bạn[span_2](start_span)[span_2](end_span)
        const firebaseConfig = {
            apiKey: "AIzaSyBf6d6065u3...",
            authDomain: "pilandapp.firebaseapp.com",
            projectId: "pilandapp",
            storageBucket: "pilandapp.appspot.com",
            messagingSenderId: "445774560229",
            appId: "1:445774560229:web:..."
        };

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let posts = [];
        let currentFilter = 'All';
        let isMyPosts = false;
        const myUserId = "user_" + (localStorage.getItem('my_device_id') || Math.random().toString(36.substring(2)));
        if(!localStorage.getItem('my_device_id')) localStorage.setItem('my_device_id', myUserId);

        window.onload = function() {
            fetchPostsFromCloud();
        };

        // Lấy danh sách từ Firestore
        async function fetchPostsFromCloud() {
            try {
                const snapshot = await db.collection('posts').orderBy('createdAt', 'desc').get();
                posts = [];
                snapshot.forEach(doc => {
                    posts.push({ id: doc.id, ...doc.data() });
                });
                renderPosts();
            } catch (error) {
                console.error("Lỗi tải dữ liệu Firebase:", error);
                document.getElementById('postsContainer').innerHTML = `<p class="col-span-full text-center text-red-500 py-10">Lỗi kết nối cơ sở dữ liệu đám mây: ${error.message}</p>`;
            }
        }

        // Đăng và Lưu bài lên Firebase
        async function savePost(event) {
            event.preventDefault();
            const editId = document.getElementById('editPostId').value;
            const imgUrl = document.getElementById('postImage').value.trim() || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80';

            const postData = {
                author: myUserId,
                title: document.getElementById('postTitle').value,
                mainCat: document.getElementById('postMainCat').value,
                price: document.getElementById('postPrice').value,
                location: document.getElementById('postLocation').value,
                sellerWallet: document.getElementById('postSellerWallet').value,
                image: imgUrl,
                desc: document.getElementById('postDesc').value,
                createdAt: new Date().toISOString()
            };

            try {
                if (editId) {
                    await db.collection('posts').doc(editId).update(postData);
                } else {
                    await db.collection('posts').add(postData);
                }
                closePostModal();
                await fetchPostsFromCloud();
                alert("Đăng bài thành công lên hệ thống đám mây chung cho mọi người xem!");
            } catch (error) {
                alert("Lỗi khi lưu bài: " + error.message);
            }
        }

        // Xóa bài đăng
        async function deletePost(id) {
            if(confirm('Bạn có chắc chắn muốn xóa bài đăng này trên hệ thống không?')) {
                try {
                    await db.collection('posts').doc(id).delete();
                    await fetchPostsFromCloud();
                } catch (error) {
                    alert("Lỗi khi xóa: " + error.message);
                }
            }
        }

        // Hiển thị danh sách ra giao diện
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            let filtered = posts;

            if (isMyPosts) {
                filtered = posts.filter(p => p.author === myUserId);
                document.getElementById('sectionTitle').innerText = "Bài đăng của riêng bạn";
            } else if (currentFilter !== 'All') {
                filtered = posts.filter(p => p.mainCat === currentFilter);
                document.getElementById('sectionTitle').innerText = `Danh mục: ${currentFilter}`;
            } else {
                document.getElementById('sectionTitle').innerText = "Tất cả bài đăng trực tuyến";
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400"><i class="fa-solid fa-box-open text-4xl mb-2"></i><p>Chưa có bài đăng nào trên hệ thống.</p></div>`;
                return;
            }

            container.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="h-48 overflow-hidden relative bg-gray-100">
                            <img src="${p.image}" alt="Product" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 bg-black/60 text-white text-xs px-2 py-1 rounded-md backdrop-blur-sm">${p.mainCat}</span>
                        </div>
                        <div class="p-4">
                            <h4 class="font-bold text-gray-900 text-base mb-1 line-clamp-1">${p.title}</h4>
                            <p class="text-blue-600 font-bold text-lg mb-2">${p.price}</p>
                            <p class="text-gray-500 text-xs mb-2 flex items-center gap-1"><i class="fa-solid fa-location-dot"></i> ${p.location}</p>
                            <p class="text-gray-600 text-xs line-clamp-2 mb-3">${p.desc || 'Không có mô tả chi tiết.'}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 border-t border-gray-100 mt-2">
                        <div class="bg-gray-50 p-2 rounded-lg mb-3 flex items-center justify-between">
                            <span class="text-xs text-gray-500 font-mono truncate max-w-[150px]" title="${p.sellerWallet}">Ví: ${p.sellerWallet}</span>
                            <button onclick="navigator.clipboard.writeText('${p.sellerWallet}'); alert('Đã sao chép địa chỉ ví!');" class="text-blue-600 hover:text-blue-800 text-xs font-semibold flex items-center gap-1">
                                <i class="fa-regular fa-copy"></i> Copy
                            </button>
                        </div>
                        ${p.author === myUserId ? `
                            <div class="flex gap-2">
                                <button onclick="deletePost('${p.id}')" class="w-full bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold py-1.5 rounded-lg transition">Xóa bài</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function filterByCategory(cat) {
            isMyPosts = false;
            currentFilter = cat;
            renderPosts();
        }

        function toggleMyPosts() {
            isMyPosts = !isMyPosts;
            currentFilter = 'All';
            const btn = document.getElementById('myPostsBtn');
            if (isMyPosts) {
                btn.classList.add('bg-blue-55', 'border-blue-500', 'text-blue-600');
            } else {
                btn.classList.remove('bg-blue-55', 'border-blue-500', 'text-blue-600');
            }
            renderPosts();
        }

        function openPostModal() {
            document.getElementById('editPostId').value = '';
            document.getElementById('modalTitle').innerText = 'Tạo bài đăng mới';
            document.getElementById('postModal').classList.remove('hidden');
        }

        function closePostModal() {
            document.getElementById('postModal').classList.add('hidden');
        }

        function filterPosts() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('postsContainer');
            const filtered = posts.filter(p => p.title.toLowerCase().includes(keyword) || p.location.toLowerCase().includes(keyword));
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400"><p>Không tìm thấy bài đăng phù hợp.</p></div>`;
                return;
            }

            // Render lại từ kết quả tìm kiếm
            // (Tương tự hàm renderPosts nhưng với mảng filtered riêng)
            let tempPosts = posts;
            posts = filtered;
            renderPosts();
            posts = tempPosts;
        }
    </script>
</body>
</html>
