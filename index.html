
<div class="sidra-wallet">
  <header class="sidra-header">
    <div class="sidra-logo">S</div>
    <strong>SIDRA DEX</strong>
    <button id="connectWallet">Connect Wallet</button>
  </header>

  <section class="sidra-card">
    <div class="sidra-tabs">
      <button class="active">Swap</button>
      <button id="buyButton">Buy</button>
      <button id="settingsButton">⚙</button>
    </div>

    <div class="sidra-token">
      <label for="payAmount">You pay</label>
      <div class="sidra-row">
        <input id="payAmount" type="number" min="0"
          placeholder="0" />
        <select id="payToken">
          <option>SDA</option>
          <option>GACP</option>
          <option>USDT</option>
        </select>
      </div>
    </div>

    <div class="sidra-switch">
      <button id="reverseTokens">↓</button>
    </div>

    <div class="sidra-token">
      <label for="receiveAmount">You receive</label>
      <div class="sidra-row">
        <input id="receiveAmount" placeholder="0" readonly />
        <select id="receiveToken">
          <option>GACP</option>
          <option>SDA</option>
          <option>USDT</option>
        </select>
      </div>
    </div>

    <button class="sidra-submit" id="swapButton">
      Enter an amount
    </button>
  </section>

  <nav class="sidra-nav">
    <button>Swap</button>
    <button>Explore</button>
    <button>Pools</button>
    <button>•••</button>
  </nav>

  <div class="sidra-modal" id="sidraModal">
    <div class="sidra-modal-content">
      <h3 id="modalTitle">SIDRA DEX</h3>
      <p id="modalMessage"></p>
      <button id="closeModal">Close</button>
    </div>
  </div>
</div>

<style>
.sidra-wallet {
  position:relative;
  box-sizing:border-box;
  min-height:750px;
  padding:22px 14px 100px;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 85% 10%,#71502555,transparent 28%),
    radial-gradient(ellipse at 10% 85%,#76501f44,transparent 25%),
    linear-gradient(145deg,#202126,#050608 70%);
  color:#f5f5f5;
  font-family:Arial,sans-serif;
}
.sidra-wallet * { box-sizing:border-box; }
.sidra-wallet button,
.sidra-wallet select { cursor:pointer; }
.sidra-wallet button {
  color:#eee;
}
.sidra-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:65px;
}
.sidra-logo {
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  border:2px solid #d6a64d;
  transform:rotate(45deg);
  color:#ffcf77;
  font-size:28px;
  font-weight:bold;
}
.sidra-header strong {
  color:#edc578;
  letter-spacing:2px;
  font-size:15px;
}
#connectWallet {
  padding:12px 14px;
  border:1px solid #d1a34f;
  border-radius:20px;
  background:linear-gradient(135deg,#a98240,#282016);
  font-size:12px;
  font-weight:bold;
}
.sidra-card {
  position:relative;
  padding:12px;
  border:3px solid #929499;
  border-radius:30px;
  background:linear-gradient(135deg,#5c5e63,#1a1b1f 30%,#33353a);
  box-shadow:0 0 0 4px #090a0c,0 0 24px #d4a24c22;
}
.sidra-tabs {
  display:flex;
  gap:4px;
  margin-bottom:18px;
  padding:4px;
  border:1px solid #686a70;
  border-radius:18px;
  background:#101115;
}
.sidra-tabs button {
  flex:1;
  padding:13px 5px;
  border:0;
  border-radius:13px;
  background:transparent;
  color:#aaa;
  font-size:16px;
}
.sidra-tabs .active {
  background:linear-gradient(#77797e,#292a2f);
  color:white;
}
.sidra-tabs #settingsButton { flex:0.5; }
.sidra-token {
  padding:23px 14px;
  border:1px solid #595b60;
  border-radius:23px;
  background:linear-gradient(145deg,#191a1e,#08090b);
  box-shadow:inset 0 2px 8px #000;
}
.sidra-token label {
  display:block;
  margin-bottom:15px;
  color:#b3b4ba;
  font-size:16px;
}
.sidra-row {
  display:flex;
  align-items:center;
  gap:8px;
}
.sidra-row input {
  width:45%;
  min-width:0;
  padding:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:42px;
}
.sidra-row select {
  width:55%;
  min-width:0;
  padding:12px 4px;
  border:1px solid #56575c;
  border-radius:28px;
  background:#18191d;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.sidra-switch {
  position:relative;
  z-index:2;
  height:0;
  margin:0 4px;
  border-top:4px solid #76787d;
}
.sidra-switch button {
  position:relative;
  display:block;
  width:68px;
  height:68px;
  margin:-36px auto 0;
  border:5px solid #85878b;
  border-radius:50%;
  background:radial-gradient(circle,#5d5e62,#151619 70%);
  color:#ffe1a0;
  font-size:32px;
  box-shadow:0 0 0 4px #151619,0 0 20px #d8a94e66;
}
.sidra-token:nth-of-type(3) {
  padding-top:38px;
}
.sidra-token:nth-of-type(3) select {
  border-color:#e5b85c;
  box-shadow:0 0 13px #d9a74655;
}
.sidra-submit {
  width:100%;
  margin-top:14px;
  padding:20px 8px;
  border:2px solid #898b90;
  border-radius:22px;
  background:linear-gradient(#4a4c51,#17181b);
  color:#e5e5e8;
  font-size:20px;
  font-weight:bold;
}
.sidra-nav {
  position:absolute;
  bottom:15px;
  left:12px;
  right:12px;
  display:flex;
  gap:3px;
  padding:6px;
  border:2px solid #55575c;
  border-radius:40px;
  background:linear-gradient(#303136,#101115);
}
.sidra-nav button {
  flex:1;
  min-width:0;
  padding:12px 2px;
  border:0;
  border-radius:30px;
  background:transparent;
  color:#b8b8bd;
  font-size:13px;
}
.sidra-nav button:first-child {
  border:1px solid #696b70;
  background:#191a1e;
  color:white;
}
.sidra-modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000c;
}
.sidra-modal.show { display:flex; }
.sidra-modal-content {
  width:100%;
  max-width:340px;
  padding:25px;
  border:1px solid #d8ad5d;
  border-radius:22px;
  background:#17181c;
  text-align:center;
}
.sidra-modal-content h3 { color:#f0cb80; }
.sidra-modal-content p { overflow-wrap:anywhere; }
.sidra-modal-content button {
  padding:10px 22px;
  border:1px solid #c9a054;
  border-radius:12px;
  background:#302516;
}
@media(max-width:380px) {
  .sidra-wallet { padding-left:8px; padding-right:8px; }
  .sidra-card { padding:8px; }
  .sidra-row input { font-size:34px; }
  .sidra-row select { font-size:14px; }
}
</style>

<script>
(function() {
  const root = document.querySelector(".sidra-wallet");
  if (!root || root.dataset.initialized) return;
  root.dataset.initialized = "true";

  const $ = id => root.querySelector("#" + id);
  const modal = $("sidraModal");

  function show(title, text) {
    $("modalTitle").textContent = title;
    $("modalMessage").textContent = text;
    modal.classList.add("show");
  }

  $("closeModal").onclick = () => modal.classList.remove("show");

  $("reverseTokens").onclick = () => {
    const a = $("payToken");
    const b = $("receiveToken");
    const temp = a.value;
    a.value = b.value;
    b.value = temp;
    $("receiveAmount").value = "";
  };

  $("payAmount").oninput = () => {
    const amount = Number($("payAmount").value);
    $("receiveAmount").value =
      amount > 0 ? String(amount) : "";
    $("swapButton").textContent =
      amount > 0 ? "Review Swap" : "Enter an amount";
  };

  $("connectWallet").onclick = async () => {
    if (!window.ethereum) {
      show("Wallet not detected",
        "Open this page in a compatible wallet browser to connect.");
      return;
    }
    try {
      const accounts = await window.ethereum.request({
        method: "eth_requestAccounts"
      });
      if (accounts && accounts.length) {
        $("connectWallet").textContent =
          accounts[0].slice(0, 6) + "..." +
          accounts[0].slice(-4);
        show("Wallet connected",
          "Wallet address: " + accounts[0]);
      }
    } catch (e) {
      show("Connection cancelled",
        e.message || "Wallet connection was not completed.");
    }
  };

  $("swapButton").onclick = () => {
    const amount = Number($("payAmount").value);
    if (!amount || amount <= 0) {
      show("Enter an amount", "Please enter a token amount.");
    } else if ($("payToken").value === $("receiveToken").value) {
      show("Choose different tokens",
        "Select two different tokens to continue.");
    } else {
      show("Demo preview",
        "Illustrative preview only. No real swap transaction was sent.");
    }
  };

  $("buyButton").onclick = () =>
    show("Buy", "Token purchasing is not connected in this demo.");

  $("settingsButton").onclick = () =>
    show("Settings", "Demo settings.");

  root.querySelectorAll(".sidra-nav button").forEach(button => {
    button.onclick = () => {
      if (button.textContent.trim() !== "Swap") {
        show(button.textContent.trim(),
          "This section is a visual demo and is not connected to a live service.");
      }
    };
  });
})();
</script>
