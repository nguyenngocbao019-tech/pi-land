 <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.minepi.com; connect-src 'self' https://socialchain.app https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com; style-src 'self' 'unsafe-inline';">
    <title>Pi Land & Property</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f7f7f7; }
        .box { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #5c2d91; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 20px; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Pi Land & Property</h2>
        <p>Hệ thống Bất động sản Phi tập trung</p>
        <button onclick="loginPi()">Đăng nhập Pi Network</button>
        <div id="status">Đang khởi tạo SDK...</div>
    </div>
    <script>
        const onIncompletePaymentFound = function(payment) {};
        document.addEventListener("DOMContentLoaded", async function() {
            try {
                await Pi.init({ version: "2.0" });
                document.getElementById("status").innerText = "Sẵn sàng đăng nhập.";
            } catch (e) {
                document.getElementById("status").innerText = "Lỗi khởi tạo SDK.";
            }
        });
        async function loginPi() {
            try {
                document.getElementById("status").innerText = "Đang xác thực...";
                const auth = await Pi.authenticate(["username"], onIncompletePaymentFound);
                const res = await fetch("https://backend.appstudio-u7cm9zhmha0ruwv8.piappengine.com/pi/auth/v1/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ accessToken: auth.accessToken })
                });
                if (!res.ok) throw new Error();
                const data = await res.json();
                document.getElementById("status").style.color = "green";
                document.getElementById("status").innerText = "Đăng nhập thành công: " + data.user.username;
            } catch (e) {
                document.getElementById("status").style.color = "red";
                document.getElementById("status").innerText = "Đăng nhập thất bại.";
            }
        }
    </script>
</body>
</html>
