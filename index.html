
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidra DEX Swap Interface</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #08090c;
      color: #f5f5f5;
    }

    .swap-container {
      width: 100%;
      max-width: 460px;
      margin: 30px auto;
      padding: 24px;
      border: 1px solid #57462a;
      border-radius: 28px;
      background:
        radial-gradient(
          circle at top,
          rgba(196, 151, 72, 0.15),
          transparent 45%
        ),
        linear-gradient(145deg, #171719, #09090b);
      box-shadow: 0 0 35px rgba(196, 151, 72, 0.08);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .brand {
      color: #e6c27a;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .wallet-button,
    .action-button {
      border: 1px solid #8d713e;
      border-radius: 14px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #c9a35d, #81602d);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .section-title {
      margin: 0 0 15px;
      font-size: 25px;
    }

    .description {
      color: #a5a5a5;
      font-size: 14px;
      line-height: 1.6;
    }

    .price-card {
      margin: 22px 0;
      padding: 17px;
      border: 1px solid #39332a;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.035);
    }

    .price-label {
      color: #aaa;
      font-size: 13px;
    }

    .price {
      margin-top: 8px;
      color: #e8c77f;
      font-size: 30px;
      font-weight: bold;
    }

    .token-box {
      margin-top: 14px;
      padding: 17px;
      border: 1px solid #373737;
      border-radius: 18px;
      background: #111214;
    }

    .token-label {
      margin-bottom: 12px;
      color: #aaa;
      font-size: 13px;
    }

    .token-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .token-select {
      min-width: 105px;
      padding: 11px;
      border: 1px solid #6f5934;
      border-radius: 12px;
      background: #24211c;
      color: #f4d69b;
      font-size: 15px;
      font-weight: bold;
    }

    .token-amount {
      width: 100%;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      text-align: right;
      font-size: 23px;
    }

    .token-amount::placeholder {
      color: #777;
    }

    .switch-row {
      display: flex;
      justify-content: center;
      margin: 12px 0;
    }

    .switch-button {
      width: 42px;
      height: 42px;
      border: 1px solid #6f5934;
      border-radius: 50%;
      background: #201b13;
      color: #e8c77f;
      font-size: 23px;
      cursor: pointer;
    }

    .main-button {
      width: 100%;
      margin-top: 22px;
      padding: 17px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(100deg, #d5b16c, #9b7437);
      color: #17120a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button:hover,
    .wallet-button:hover,
    .action-button:hover {
      filter: brightness(1.12);
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .footer-actions button {
      flex: 1;
      padding: 12px 6px;
      border: 1px solid #39342b;
      border-radius: 12px;
      background: #171719;
      color: #d9c18f;
      cursor: pointer;
    }

    .notice {
      margin-top: 18px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.78);
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 360px;
      padding: 25px;
      border: 1px solid #8d713e;
      border-radius: 22px;
      background: #151515;
      text-align: center;
    }

    .modal-content h3 {
      color: #e8c77f;
    }

    .modal-content p {
      color: #bbb;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .close-button {
      margin-top: 12px;
      padding: 10px 20px;
      border: 1px solid #66512f;
      border-radius: 10px;
      background: #27221a;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 380px) {
      body {
        padding: 10px;
      }

      .swap-container {
        padding: 16px;
      }

      .brand {
        font-size: 18px;
      }

      .token-select {
        min-width: 90px;
      }
    }
  </style>
</head>

<body>

  <main class="swap-container">
    <header class="header">
      <div class="brand">SIDRA DEX</div>
      <button class="wallet-button" id="walletButton">
        Connect Wallet
      </button>
    </header>

    <h1 class="section-title">Swap Tokens</h1>

    <p class="description">
      Exchange SDA, GACP and USDT in a modern,
      dark metallic interface.
    </p>

    <section class="price-card">
      <div class="price-label">Displayed Market Value</div>
      <div class="price">$75,590</div>
    </section>

    <section class="token-box">
      <div class="token-label">You pay</div>
      <div class="token-row">
        <select class="token-select" id="fromToken">
          <option value="SDA">SDA</option>
          <option value="GACP">GACP</option>
          <option value="USDT">USDT</option>
        </select>

        <input
          class="token-amount"
          id="fromAmount"
          type="number"
          min="0"
          placeholder="0.00"
          inputmode="decimal"
        >
      </div>
    </section>

    <div class="switch-row">
      <button
        class="switch-button"
        id="switchButton"
        aria-label="Switch tokens"
      >↕</button>
    </div>

    <section class="token-box">
      <div class="token-label">You receive</div>
      <div class="token-row">
        <select class="token-select" id="toToken">
          <option value="USDT">USDT</option>
          <option value="SDA">SDA</option>
          <option value="GACP">GACP</option>
        </select>

        <input
          class="token-amount"
          id="toAmount"
          type="text"
          placeholder="0.00"
          readonly
        >
      </div>
    </section>

    <button class="main-button" id="swapButton">
      Review Swap
    </button>

    <div class="footer-actions">
      <button data-modal="buy">Buy</button>
      <button data-modal="explore">Explore</button>
      <button data-modal="pools">Pools</button>
      <button data-modal="settings">Settings</button>
    </div>

    <p class="notice">
      Demo interface only. Prices and token conversions are
      not connected to a live market. No real swap is executed.
    </p>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Information</h3>
      <p id="modalMessage"></p>
      <button class="close-button" id="closeModal">
        Close
      </button>
    </div>
  </div>

  <script>
    const fromToken = document.getElementById("fromToken");
    const toToken = document.getElementById("toToken");
    const fromAmount = document.getElementById("fromAmount");
    const toAmount = document.getElementById("toAmount");

    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");

    function showModal(title, message) {
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      modal.classList.add("show");
    }

    function closeModal() {
      modal.classList.remove("show");
    }

    document.getElementById("closeModal")
      .addEventListener("click", closeModal);

    modal.addEventListener("click", function(event) {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.getElementById("switchButton")
      .addEventListener("click", function() {
        const oldFrom = fromToken.value;
        fromToken.value = toToken.value;
        toToken.value = oldFrom;

        fromAmount.value = "";
        toAmount.value = "";
      });

    fromAmount.addEventListener("input", function() {
      const amount = Number(fromAmount.value);

      if (!Number.isFinite(amount) || amount < 0) {
        toAmount.value = "";
        return;
      }

      // Demo only: 1:1 conversion, not a real market quote.
      toAmount.value = amount > 0
        ? amount.toLocaleString("en-US", {
            maximumFractionDigits: 6
          })
        : "";
    });

    document.getElementById("walletButton")
      .addEventListener("click", async function() {
        if (!window.ethereum) {
          showModal(
            "Wallet not detected",
            "Please open this page in a compatible wallet browser, or install a supported Web3 wallet."
          );
          return;
        }

        try {
          const accounts = await window.ethereum
            .request({ method: "eth_requestAccounts" });

          if (accounts && accounts.length > 0) {
            this.textContent =
              accounts[0].slice(0, 6) + "..." +
              accounts[0].slice(-4);

            showModal(
              "Wallet Connected",
              "Wallet address: " + accounts[0]
            );
          }
        } catch (error) {
          showModal(
            "Connection cancelled",
            error.message || "The wallet connection was not completed."
          );
        }
      });

    document.getElementById("swapButton")
      .addEventListener("click", function() {
        const amount = Number(fromAmount.value);

        if (!fromAmount.value || amount <= 0) {
          showModal(
            "Enter an amount",
            "Please enter a token amount greater than zero."
          );
          return;
        }

        if (fromToken.value === toToken.value) {
          showModal(
            "Choose different tokens",
            "The tokens you pay and receive must be different."
          );
          return;
        }

        showModal(
          "Demo Swap Preview",
          "You pay " + amount + " " + fromToken.value +
          " and receive an illustrative " + toAmount.value +
          " " + toToken.value +
          ". This is a preview only. No transaction was sent."
        );
      });

    document.querySelectorAll("[data-modal]")
      .forEach(function(button) {
        button.addEventListener("click", function() {
          const section = this.dataset.modal;

          const messages = {
            buy: "Buy section demo. Connect a supported service to enable real purchases.",
            explore: "Explore section demo. Add verified token and market data to show live listings.",
            pools: "Pools section demo. Connect a supported liquidity protocol to display real pools.",
            settings: "Demo settings: the interface currently uses illustrative values and does not execute trades."
          };

          showModal(
            section.charAt(0).toUpperCase() + section.slice(1),
            messages[section]
          );
        });
      });
  </script>

</body>
</html>
